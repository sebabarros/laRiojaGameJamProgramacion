<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programación para Videojuegos · La Rioja Game Jam</title>
<meta name="description" content="Introducción a la programación para videojuegos. Clase de Saga Barros para La Rioja Game Jam.">
<style>
:root{color-scheme:dark;--bg:#101421;--panel:#1b2334;--fg:#f5f3ea;--muted:#b5bdd0;--accent:#c8f36b;--line:#374158}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 15%,#26354a 0,transparent 35%),var(--bg);color:var(--fg);font:20px/1.45 system-ui,Segoe UI,sans-serif}button,select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem;cursor:pointer}button:hover,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}a{color:var(--accent)}header,footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:12px 3vw;border-color:var(--line);background:#101421}header{border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);position:sticky;bottom:0}.brand{font-size:.8rem;letter-spacing:.12em;font-weight:700}.tools,.nav{display:flex;gap:.5rem;align-items:center}.slide{max-width:1440px;min-height:calc(100dvh - 120px);margin:auto;padding:clamp(24px,5vw,76px) 5vw}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.15em;font-size:.8rem;font-weight:700;margin-bottom:1rem}h1{font-size:clamp(2.5rem,5vw,5.5rem);line-height:1.04;letter-spacing:-.045em;margin:.1rem 0 1.2rem;max-width:1100px}h2{font-size:clamp(1.15rem,2vw,1.8rem);color:var(--accent);margin:0 0 .55rem}.lead{font-size:clamp(1.45rem,2.5vw,2.5rem);line-height:1.24;max-width:1050px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem;max-width:1120px}.card{background:#1b2334d9;border:1px solid var(--line);border-radius:12px;padding:1.25rem 1.45rem}.card p{margin:.3rem 0}.card strong{color:var(--accent)}.prompt{border-left:4px solid var(--accent);padding-left:1rem;margin-top:1.6rem}.code{font:clamp(1rem,1.6vw,1.45rem)/1.6 Consolas,monospace;background:#080d16;border:1px solid var(--line);border-radius:10px;padding:1.2rem;white-space:pre-wrap}.engine{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,1.1fr);gap:2.5rem;align-items:center}.engine ul{padding-left:1.4rem}.engine li{margin:.55rem 0}.video{aspect-ratio:16/9;background:#080d16;border:1px solid var(--line);border-radius:10px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.small{font-size:.9rem;color:var(--muted)}.profile{display:grid;grid-template-columns:230px 1fr;gap:2.5rem;align-items:center}.profile img{width:230px;height:230px;object-fit:cover;border-radius:50%;border:5px solid var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:.7rem}.chip{padding:.55rem .9rem;border:1px solid var(--line);border-radius:100px;background:var(--panel)}#notes{padding:1rem 5vw;border-top:1px solid var(--line);background:#202b3e;font-size:1rem}#notes[hidden]{display:none}#counter{min-width:4rem;text-align:center}#progress{position:fixed;bottom:0;left:0;height:3px;background:var(--accent);transition:width .2s}select{max-width:32vw}ul{margin-top:.5rem}@media(max-width:850px){.engine,.grid,.profile{grid-template-columns:1fr}.profile img{width:150px;height:150px}.slide{min-height:calc(100dvh - 160px)}header,footer{flex-wrap:wrap}select{max-width:100%}.brand{width:100%}}@media print{header,footer,#notes,#progress,.video{display:none!important}.slide{min-height:0;page-break-after:always;background:white;color:black}body{background:white;color:black}h2,.eyebrow{color:#325600}.card,.code{background:white;color:black;border-color:#999}}
</style>
</head>
<body>
<header><span class="brand">LA RIOJA GAME JAM / PROGRAMACIÓN</span><div class="tools"><button id="notesButton" aria-expanded="false">Notas docentes</button><button id="fullButton">Pantalla completa</button></div></header>
<main id="slide" class="slide" aria-live="polite"></main><aside id="notes" hidden></aside>
<footer><select id="toc" aria-label="Ir a una placa"></select><div class="nav"><button id="prev">Anterior</button><span id="counter"></span><button id="next">Siguiente</button></div></footer><div id="progress"></div>
<script>
const slides=[
{section:'Bienvenida',title:'Programación para Videojuegos',body:`<p class="lead">La Rioja Game Jam</p><p class="prompt">De una idea a un juego que responde a quien juega.</p>`,notes:'Abrir con una pregunta: ¿qué tiene que pasar para que un personaje salte? Escuchar respuestas y usarlas para anticipar entradas, reglas, estados y feedback.'},
{section:'Docente',title:'Saga Barros',body:`<div class="profile"><img src="https://avatars.githubusercontent.com/u/32941808?v=4" alt="Foto de perfil de Saga Barros en GitHub"><div><p class="lead">Programación, producción y diseño lúdico.</p><p>Presidente de Tucumán Videojuegos Cooperativa.</p><p class="small">Foto: perfil de GitHub de <a href="https://github.com/sebabarros" target="_blank" rel="noopener">sebabarros</a>.</p></div></div>`,notes:'Presentación personal breve. Contar una experiencia concreta de trabajo interdisciplinario antes de pasar a los conceptos.'},
{section:'Fundamentos',title:'¿Qué programamos en un videojuego?',body:`<div class="grid"><div class="card"><h2>Entradas</h2><p>Teclado, mouse, pantalla táctil o control.</p></div><div class="card"><h2>Reglas y estados</h2><p>Cuándo se puede saltar, recibir daño o ganar.</p></div><div class="card"><h2>Respuesta</h2><p>Movimiento, animación, sonido e interfaz.</p></div><div class="card"><h2>Prueba</h2><p>Observar qué hizo la persona y ajustar el juego.</p></div></div><p class="prompt">Si aprieto saltar, ¿qué condiciones deben cumplirse y qué cambia?</p>`,notes:'Usar el salto como ejemplo. Entrada: botón. Regla: está en el piso. Estado: velocidad vertical. Respuesta: animación y sonido. Aclarar que la programación conversa con diseño, arte y audio.'},
{section:'Fundamentos',title:'Objetos, ciclo y eventos',body:`<div class="grid"><div class="card"><h2>Objetos y componentes</h2><p>Personaje, enemigo y puerta tienen datos y comportamientos. La orientación a objetos ayuda a organizar algunos proyectos; no es la única forma de programar juegos.</p></div><div class="card"><h2>Game loop</h2><p>El juego repite: leer entradas, actualizar el mundo y dibujar el resultado. Sucede muchas veces por segundo.</p></div><div class="card"><h2>Eventos y colisiones</h2><p>Una regla puede reaccionar cuando dos objetos se tocan o cuando llega una señal.</p></div><div class="card"><h2>Tiempo y estados</h2><p>Movimiento, pausas y animaciones deben comportarse de forma consistente aunque cambie la velocidad de la computadora.</p></div></div>`,notes:'Dibujar en el pizarrón el ciclo entrada → actualización → imagen. Construct trabaja especialmente bien con objetos, comportamientos y hojas de eventos. Mencionar delta time sin detenerse en fórmulas.'},
{section:'Motores',title:'¿Qué es un motor de videojuegos?',body:`<p class="lead">Es una base de software y herramientas para construir un juego sin rehacer todo desde cero.</p><div class="grid"><div class="card"><h2>Durante el juego</h2><p>Procesa entradas, actualiza reglas y estados, dibuja imágenes y reproduce sonido.</p></div><div class="card"><h2>Durante el desarrollo</h2><p>Ofrece editores para organizar escenas, objetos, recursos y pruebas.</p></div></div><p class="prompt">El motor pone la infraestructura; el equipo crea las reglas y la experiencia particular.</p>`,notes:'Retomar el game loop de la placa anterior. Un motor suele incluir renderizado, entrada, audio y otros sistemas, pero su alcance varía. Fuente de contexto: https://learn.unity.com/tutorial/what-is-unity?tab=overview'},
{section:'Motores',title:'De cada juego a una base reutilizable',body:`<div class="grid"><div class="card"><h2>Herramientas hechas para un juego</h2><p>Tecnología creada a medida para un proyecto.</p><p class="small">Ejemplos: <em>Karateka</em> y <em>Prince of Persia</em> (1989).</p></div><div class="card"><h2>Motores internos</h2><p>Una base que el estudio reutiliza y adapta.</p><p class="small">Ejemplos: <em>Maniac Mansion</em> y <em>The Secret of Monkey Island</em>, ambos con SCUMM.</p></div><div class="card"><h2>Licencias para otros equipos</h2><p>Estudios externos usan un motor desarrollado por otra empresa.</p><p class="small">Ejemplos: <em>BioShock</em> y <em>Batman: Arkham City</em>, con Unreal Engine.</p></div><div class="card"><h2>Acceso más amplio</h2><p>Los motores llegan también a equipos independientes pequeños.</p><p class="small">Ejemplos: <em>Hollow Knight</em> y <em>Cuphead</em>, con Unity.</p></div></div><p class="small">Estas formas de trabajo todavía conviven.</p>`,notes:'No presentar una secuencia rígida: existen motores propios y motores de terceros en la actualidad. Karateka y Prince of Persia: https://www.jordanmechner.com/en/games-movies/karateka/ y https://www.jordanmechner.com/en/games-movies/prince-of-persia/. SCUMM: https://www.lucasfilm.com/news/lucasfilm-originals-scumm/. Unreal Engine y juegos de terceros: https://cdn2.unrealengine.com/dkt-376-02-2022-11-17-exhibit-a-epic-second-amended-complaint-ac136b0a7870.pdf. Unity: https://unity.com/made-with-unity/hollow-knight y https://unity.com/made-with-unity/cuphead.'},
{section:'Motores',title:'Motores propios que hicieron escuela',body:`<div class="grid"><div class="card"><h2>SCUMM · Lucasfilm Games</h2><p>Nació para <em>Maniac Mansion</em> y luego sostuvo otras aventuras, entre ellas <em>Monkey Island</em>.</p></div><div class="card"><h2>Source · Valve</h2><p>Una base interna que evolucionó entre proyectos y herramientas del estudio.</p></div><div class="card"><h2>CryEngine · Crytek</h2><p>Impulsó <em>Far Cry</em> y puso el foco en mundos 3D extensos.</p></div><div class="card"><h2>id Tech · id Software</h2><p>La familia tecnológica detrás de distintas generaciones de juegos de id.</p></div></div><p class="prompt">La necesidad de un juego puede convertirse en una herramienta para muchos.</p>`,notes:'SCUMM es un ejemplo claro de herramienta interna reutilizada: https://www.lucasfilm.com/news/lucasfilm-originals-scumm/. Far Cry y CryEngine 1: https://www.cryengine.com/news/view/-tbt-check-out-the-original-far-cry-launch-trailer-in-glorious-hd. Source e id Tech se citan como familias de motores internos; no afirmar que sus versiones sean idénticas entre juegos.'},
{section:'Motores',title:'Godot',body:`<div class="engine"><div><p class="lead">Motor libre y de código abierto.</p><ul><li>Organiza el juego en escenas y nodos.</li><li>Sirve para proyectos 2D y 3D.</li><li>Permite programar con GDScript, C# y otras opciones.</li></ul><p class="small">Video: <a href="https://www.youtube.com/watch?v=7ZwEmxihlw4" target="_blank" rel="noopener">Godot Engine, showreel 2025</a>.</p></div><div class="video"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/7ZwEmxihlw4" title="Godot Engine, showreel 2025" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>`,notes:'Mostrar entre 30 y 60 segundos. Preguntar qué estilos de juego aparecen. Si falla el reproductor, abrir el enlace directo.'},
{section:'Motores',title:'Unity',body:`<div class="engine"><div><p class="lead">Motor muy usado para juegos 2D y 3D.</p><ul><li>Trabaja con escenas, GameObjects y componentes.</li><li>La programación habitual usa C#.</li><li>Tiene herramientas para múltiples plataformas.</li></ul><p class="small">Video: <a href="https://www.youtube.com/shorts/LlgHCeLV92Y" target="_blank" rel="noopener">Made with Unity Games sizzle 2025</a>.</p></div><div class="video"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/LlgHCeLV92Y" title="Made with Unity Games sizzle 2025" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>`,notes:'Mostrar un minuto. Señalar cómo distintos juegos pueden compartir motor y diferir en estética y reglas. El enlace abre el video original si el incrustado falla.'},
{section:'Motores',title:'Unreal Engine',body:`<div class="engine"><div><p class="lead">Motor con herramientas potentes para 3D.</p><ul><li>Ofrece programación visual con Blueprints.</li><li>También permite trabajar con C++.</li><li>Se usa en juegos y otras experiencias interactivas.</li></ul><p class="small">Video: <a href="https://www.youtube.com/watch?v=BihpM5I05XM" target="_blank" rel="noopener">Unreal Fellowship: Games 2025</a>.</p></div><div class="video"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/BihpM5I05XM" title="Unreal Fellowship Games 2025" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>`,notes:'Mostrar entre 30 y 60 segundos. Blueprints es programación visual: representa reglas mediante nodos. Evitar equiparar tamaño del motor con calidad del juego.'},
{section:'Herramientas',title:'Otros caminos para crear',body:`<div class="grid"><div class="card"><h2>Twine</h2><p>Historias interactivas de texto con pasajes y elecciones.</p></div><div class="card"><h2>RPG Maker</h2><p>Mapas, personajes, combates y eventos para juegos de rol.</p></div><div class="card"><h2>GameMaker</h2><p>Herramientas enfocadas en juegos 2D.</p></div><div class="card"><h2>Construct</h2><p>Editor visual y hojas de eventos. Ideal para probar una mecánica rápidamente.</p></div></div><p class="prompt">La herramienta se elige según el juego, el equipo y el tiempo disponible.</p>`,notes:'En una game jam importa llegar pronto a un prototipo jugable. Estas herramientas ofrecen distintos puntos de partida. Twine puede ser suficiente para un juego narrativo completo.'},
{section:'Práctica',title:'Arrancamos con Construct',body:`<p class="lead">Vamos a crear una interacción simple y probarla en el navegador.</p><div class="grid"><div class="card"><h2>1. Objeto</h2><p>Agregamos un personaje.</p></div><div class="card"><h2>2. Evento</h2><p>Definimos cuándo ocurre una acción.</p></div><div class="card"><h2>3. Respuesta</h2><p>Hacemos que el juego cambie.</p></div><div class="card"><h2>4. Prueba</h2><p>Jugamos, observamos y ajustamos.</p></div></div><p class="prompt">Primer objetivo: que una acción del jugador produzca una respuesta visible.</p>`,notes:'Pasar a Construct. Empezar con un proyecto vacío y una mecánica mínima. Pedir que prueben tras cada cambio para que puedan relacionar evento y resultado.'}
];
let current=0;const slide=document.getElementById('slide'),notes=document.getElementById('notes'),toc=document.getElementById('toc');slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.title}`;toc.append(o)});function show(i){current=Math.max(0,Math.min(slides.length-1,i));let s=slides[current];slide.innerHTML=`<div class="eyebrow">${String(current+1).padStart(2,'0')} / ${s.section}</div><h1>${s.title}</h1>${s.body}`;notes.textContent=s.notes;toc.value=current;document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;location.hash=`placa-${current+1}`;}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);toc.onchange=()=>show(Number(toc.value));document.getElementById('notesButton').onclick=()=>{notes.hidden=!notes.hidden;document.getElementById('notesButton').setAttribute('aria-expanded',String(!notes.hidden))};document.getElementById('fullButton').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key.toLowerCase()==='n')document.getElementById('notesButton').click();if(e.key.toLowerCase()==='f')document.getElementById('fullButton').click();if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});let initial=Number(location.hash.match(/placa-(\d+)/)?.[1]||1);show(initial-1);
</script>
</body></html>
